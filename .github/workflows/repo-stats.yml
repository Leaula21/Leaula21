name: Update Repo Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Count repos
        id: count
        run: |
          PUBLIC=$(curl -s https://api.github.com/users/Leaula21 | jq '.public_repos')
          TOTAL_PRIVATE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/user | jq '.total_private_repos')
          echo "private=$TOTAL_PRIVATE" >> $GITHUB_OUTPUT

      - name: Update README
        run: |
          PRIVATE="${{ steps.count.outputs.private }}"
          if [ "$PRIVATE" != "null" ] && [ -n "$PRIVATE" ]; then
            sed -i "s/<!--PRIVATE_REPOS-->[0-9]*<!--\/PRIVATE_REPOS-->/<!--PRIVATE_REPOS-->$PRIVATE<!--\/PRIVATE_REPOS-->/" README.md
          fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update private repo count"
          git push
